# ============================================================
# CI/CD пайплайн для RAG API
# Запускается при push и pull request в ветку main
# Выполняет: установку зависимостей, тесты, сборку Docker-образа
# ============================================================

name: CI Pipeline

# События, при которых запускается пайплайн
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------
  # Job 1: Тестирование приложения
  # --------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получение кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Установка Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Шаг 3: Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 4: Запуск автотестов
      - name: Run tests with pytest
        run: pytest -v

  # --------------------------------------------------------
  # Job 2: Сборка Docker-образа
  # --------------------------------------------------------
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test          # запускается только после успешных тестов

    steps:
      # Шаг 1: Получение кода
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Сборка Docker-образа (без публикации)
      - name: Build Docker image
        run: docker build -t rag-api:ci .
